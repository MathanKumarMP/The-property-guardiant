<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      Thank You | The Property Guardian — NRI Property Management Tamil Nadu
    </title>
    <meta
      name="description"
      content="Thank you for your enquiry. Our representative will get in touch with you shortly."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="assets/logo-color.png" />
    <link rel="stylesheet" href="css/styles.css?v=37.0" />
  </head>

  <body>
    <div class="ty-page-wrapper">

      <!-- Full-screen Hero Section with blurred background & centered card -->
      <section class="ty-hero-area">
        <div class="ty-bg-image"></div>
        <div class="ty-bg-overlay"></div>

        <!-- Center Card (Exact match to image) -->
        <div class="ty-card">
          <div class="ty-card-accent"></div>

          <div class="ty-icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>

          <h1 class="ty-heading">Thank You!</h1>
          <h2 class="ty-subheading" id="ty-subheading">Enquiry Submitted!</h2>

          <p class="ty-desc" id="ty-desc">
            We have received your enquiry. Our representative will get in touch with you shortly.
          </p>

          <a
            href="index.html"
            class="ty-close-btn"
            id="ty-close-btn"
          >Close</a>
        </div>
      </section>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        var params = new URLSearchParams(window.location.search);
        if (params.get('download') === 'brochure') {
          var subHeading = document.getElementById('ty-subheading');
          var desc = document.getElementById('ty-desc');

          if (subHeading) subHeading.textContent = 'Enquiry Submitted!';
          if (desc) desc.textContent = 'We have received your enquiry. Our representative will get in touch with you shortly.';
        }
      });
    </script>
  </body>
</html>
